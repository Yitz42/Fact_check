<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact Check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Fact Check</h1>
    <p class="sub">Your text stays exactly as written. False claims are highlighted in red, click one for the corrected fact.</p>
  </header>

  <section class="settings" aria-label="AI settings">
    <label class="field">
      <span>Anthropic API key</span>
      <input id="key" type="password" placeholder="sk-ant-…" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">
      <span>AI model</span>
      <span class="row">
        <select id="model"></select>
        <button id="load-models" type="button" title="List the models your key can use">Load my models</button>
      </span>
    </label>
    <label class="remember"><input id="remember" type="checkbox"> Remember key on this device</label>
    <p class="hint">Sent only to Anthropic, via this local server. Use an API key from console.anthropic.com (a Claude.ai or Claude Code login won't work).</p>
  </section>

  <div class="docs-bar">
    <div id="tabs" class="tabs" role="tablist"></div>
    <div class="docs-actions">
      <button id="add-doc" type="button" title="New blank text" aria-label="New blank text">+ New</button>
      <button id="upload" type="button">Upload files…</button>
    </div>
    <input id="file" type="file" multiple hidden accept=".txt,.md,.markdown,.csv,.tsv,.json,.html,.htm,.xml,.log,.pdf,.docx">
  </div>

  <div id="drop" class="drop">
    <textarea id="input" placeholder="Paste or type your text here, or drop a file (.txt .md .pdf .docx .html .csv …)" spellcheck="false" autofocus></textarea>
    <div id="review" class="review" hidden></div>
  </div>

  <div class="bar">
    <button id="check" class="primary">Fact-check</button>
    <button id="edit" hidden>Edit text</button>
    <span id="status" role="status"></span>
  </div>
</main>

<div id="bubble" class="bubble" role="dialog" aria-label="Corrected fact" hidden>
  <div class="bubble-label">Corrected fact</div>
  <p id="bubble-correction" class="bubble-correction"></p>
  <p id="bubble-why" class="bubble-why"></p>
</div>

<script src="app.js"></script>
</body>
</html>
